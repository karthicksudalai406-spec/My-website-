<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Home Account</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033
}
header{
  background:#173b70;
  color:white;
  padding:22px 15px;
  text-align:center
}
header h2{margin:0 0 8px}
.container{max-width:650px;margin:auto;padding:14px}
nav{
  display:flex;
  gap:6px;
  padding:10px;
  background:white;
  position:sticky;
  top:0;
  z-index:2
}
nav button{
  flex:1;
  padding:12px 3px;
  border:0;
  border-radius:8px;
  background:#e2e8f0;
  font-weight:bold
}
nav button.active{background:#173b70;color:white}
.page{display:none}
.page.active{display:block}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.card,.box{
  background:white;
  padding:15px;
  margin-bottom:12px;
  border-radius:12px;
  box-shadow:0 2px 8px #00000008
}
.card p{color:#64748b;margin:0 0 8px}
.card h3{margin:0;overflow-wrap:anywhere}
.green{color:#15803d}
.red{color:#dc2626}
input,select,textarea{
  display:block;
  width:100%;
  padding:12px;
  margin:8px 0 14px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  background:white
}
label{font-weight:bold;font-size:14px}
button{cursor:pointer}
.main-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#173b70;
  color:white;
  font-size:16px;
  margin:4px 0
}
.secondary{background:#475569}
.item{
  background:white;
  border-left:4px solid #173b70;
  border-radius:8px;
  padding:12px;
  margin:10px 0;
  overflow-wrap:anywhere
}
.item button{
  padding:8px 12px;
  margin:8px 5px 0 0;
  border:0;
  border-radius:6px;
  background:#e2e8f0
}
.item .del{background:#fee2e2;color:#b91c1c}
.small{font-size:13px;color:#64748b}
footer{text-align:center;padding:18px;color:#64748b}
</style>
</head>

<body>

<header>
  <h2>🏠 My Home Account</h2>
  <div>உங்கள் வரவு செலவுக் கணக்கு</div>
</header>

<nav>
  <button class="active" data-page="home">Home</button>
  <button data-page="add">Add Account</button>
  <button data-page="history">History</button>
</nav>

<div class="container">

<section id="home" class="page active">
  <h3>📊 மொத்தக் கணக்கு</h3>

  <div class="cards">
    <div class="card">
      <p>மொத்த வரவு</p>
      <h3 class="green" id="incomeTotal">₹0</h3>
    </div>
    <div class="card">
      <p>மொத்த செலவு</p>
      <h3 class="red" id="expenseTotal">₹0</h3>
    </div>
    <div class="card" style="grid-column:span 2">
      <p>மீதமுள்ள தொகை</p>
      <h3 id="balance">₹0</h3>
    </div>
  </div>

  <div class="box">
    <h3>📅 தேதி அடிப்படையில் கணக்கு</h3>
    <label>தொடக்க தேதி</label>
    <input type="date" id="fromDate">
    <label>முடிவு தேதி</label>
    <input type="date" id="toDate">
    <button class="main-btn" id="reportBtn">அறிக்கை பார்க்க</button>
    <button class="main-btn secondary" id="allReportBtn">முழுக் கணக்கு</button>
    <div id="report"></div>
  </div>

  <div class="box">
    <h3>கடைசியாகச் சேர்த்த கணக்குகள்</h3>
    <div id="recent"></div>
  </div>
</section>

<section id="add" class="page">
  <h3 id="formTitle">✍️ புதிய கணக்கு</h3>

  <div class="box">
    <form id="accountForm">
      <input type="hidden" id="editId">

      <label>பெயர்</label>
      <input id="person" placeholder="பெயரை Type செய்யவும்">

      <label>கணக்கு வகை</label>
      <select id="type">
        <option value="income">வரவு</option>
        <option value="expense">செலவு</option>
      </select>

      <label>விவரம்</label>
      <input id="description" placeholder="விவரத்தை Type செய்யவும்" required>

      <label>Amount (₹)</label>
      <input id="amount" type="number" min="0.01" step="any"
             placeholder="தொகையை Type செய்யவும்" required>

      <label>தேதி</label>
      <input id="date" type="date" required>

      <label>குறிப்புகள்</label>
      <textarea id="notes" rows="3"
                placeholder="குறிப்புகளை Type செய்யவும்"></textarea>

      <button class="main-btn" type="submit" id="saveBtn">Save Account</button>
      <button class="main-btn secondary" type="button" id="cancelEdit"
              hidden>Cancel Edit</button>
    </form>
  </div>
</section>

<section id="history" class="page">
  <h3>📚 கணக்கு வரலாறு</h3>

  <div class="box">
    <label>Search — பெயர் அல்லது விவரம்</label>
    <input id="search" placeholder="இங்கே Type செய்யவும்">

    <label>கணக்கு வகை</label>
    <select id="filterType">
      <option value="all">அனைத்தும்</option>
      <option value="income">வரவு மட்டும்</option>
      <option value="expense">செலவு மட்டும்</option>
    </select>

    <label>மாதம்</label>
    <input type="month" id="filterMonth">

    <button class="main-btn secondary" id="clearFilters">Filter நீக்கு</button>
    <div id="historyList"></div>
  </div>
</section>

<div class="box">
  <h3>💾 Backup & Restore</h3>
  <p class="small">உங்கள் கணக்குகளை JSON கோப்பாகப் பாதுகாக்கலாம்.</p>
  <button class="main-btn" id="backupBtn">Backup Download</button>

  <label>Backup கோப்பைத் தேர்ந்தெடுக்கவும்</label>
  <input type="file" id="backupFile" accept=".json,application/json">
  <button class="main-btn secondary" id="restoreBtn">Restore Backup</button>
</div>

</div>

<footer>My Home Account</footer>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = "myHomeAccount_v2";

function today(){
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function readData(){
  try{
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(value) ? value : [];
  }catch(e){
    alert("சேமித்த தகவல்களைப் படிக்க முடியவில்லை. Backup கோப்பு இருந்தால் பாதுகாக்கவும்.");
    return [];
  }
}

let accounts = readData();

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
    return true;
  }catch(e){
    alert("தகவல்களைச் சேமிக்க முடியவில்லை. மொபைலில் சேமிப்பு இடத்தைச் சரிபார்க்கவும்.");
    return false;
  }
}

function money(n){
  return "₹" + Number(n).toLocaleString("en-IN", {
    maximumFractionDigits:2
  });
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function totals(list){
  const income = list.filter(a => a.type === "income")
    .reduce((s,a) => s + Number(a.amount),0);

  const expense = list.filter(a => a.type === "expense")
    .reduce((s,a) => s + Number(a.amount),0);

  return {income, expense, balance:income-expense};
}

function renderHome(){
  const t = totals(accounts);
  $("incomeTotal").textContent = money(t.income);
  $("expenseTotal").textContent = money(t.expense);
  $("balance").textContent = money(t.balance);

  const recent = [...accounts].sort((a,b) =>
    b.createdAt-a.createdAt).slice(0,5);

  $("recent").innerHTML = recent.length ? recent.map(a => `
    <div class="item">
      <b>${escapeHTML(a.description)}</b>
      <div>${escapeHTML(a.person)}</div>
      <div class="${a.type==="income"?"green":"red"}">
        ${a.type==="income"?"+":"−"}${money(a.amount)}
      </div>
      <div class="small">${escapeHTML(a.date)}</div>
    </div>
  `).join("") : "<p>இன்னும் கணக்குகள் சேர்க்கப்படவில்லை.</p>";
}

function renderHistory(){
  const query = $("search").value.trim().toLowerCase();
  const type = $("filterType").value;
  const month = $("filterMonth").value;

  const list = [...accounts].filter(a => {
    const matchesText = [
      a.person,a.description,a.notes
    ].some(v => String(v || "").toLowerCase().includes(query));

    return matchesText &&
      (type==="all" || a.type===type) &&
      (!month || a.date.startsWith(month));
  }).sort((a,b) => b.date.localeCompare(a.date) ||
                     b.createdAt-a.createdAt);

  $("historyList").innerHTML = list.length ? list.map(a => `
    <div class="item">
      <b>${escapeHTML(a.description)}</b>
      <p>${escapeHTML(a.person)}</p>
      <p class="${a.type==="income"?"green":"red"}">
        ${a.type==="income"?"வரவு":"செலவு"}: ${money(a.amount)}
      </p>
      <div class="small">தேதி: ${escapeHTML(a.date)}</div>
      <div>${escapeHTML(a.notes)}</div>
      <button data-edit="${escapeHTML(a.id)}">Edit</button>
      <button class="del" data-delete="${escapeHTML(a.id)}">Delete</button>
    </div>
  `).join("") : "<p>கணக்குகள் எதுவும் இல்லை.</p>";
}

function renderReport(){
  const from = $("fromDate").value;
  const to = $("toDate").value;

  if(from && to && from > to){
    $("report").textContent = "தொடக்க தேதி முடிவு தேதிக்கு முன் இருக்க வேண்டும்.";
    return;
  }

  const list = accounts.filter(a =>
    (!from || a.date >= from) && (!to || a.date <= to)
  );

  const t = totals(list);
  $("report").innerHTML = `
    <p>கணக்குகள்: ${list.length}</p>
    <p class="green">மொத்த வரவு: ${money(t.income)}</p>
    <p class="red">மொத்த செலவு: ${money(t.expense)}</p>
    <p><b>மீதம்: ${money(t.balance)}</b></p>
  `;
}

function renderAll(){
  renderHome();
  renderHistory();
  renderReport();
}

function showPage(page){
  document.querySelectorAll(".page").forEach(p =>
    p.classList.toggle("active",p.id===page));

  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("active",b.dataset.page===page));

  renderAll();
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

$("accountForm").addEventListener("submit", e => {
  e.preventDefault();

  const amount = Number($("amount").value);
  const description = $("description").value.trim();
  const date = $("date").value;

  if(!description || !date || !Number.isFinite(amount) || amount <= 0){
    alert("விவரம், தேதி மற்றும் சரியான Amount உள்ளிடவும்.");
    return;
  }

  const editId = $("editId").value;

  if(editId){
    const index = accounts.findIndex(a => a.id===editId);
    if(index < 0){
      alert("இந்தக் கணக்கு கிடைக்கவில்லை.");
      return;
    }

    accounts[index] = {
      ...accounts[index],
      person:$("person").value.trim(),
      type:$("type").value,
      description,
      amount,
      date,
      notes:$("notes").value.trim()
    };
  }else{
    accounts.push({
      id: (crypto.randomUUID ? crypto.randomUUID() :
          String(Date.now()) + Math.random()),
      person:$("person").value.trim(),
      type:$("type").value,
      description,
      amount,
      date,
      notes:$("notes").value.trim(),
      createdAt:Date.now()
    });
  }

  if(saveData()){
    e.target.reset();
    $("editId").value="";
    $("date").value=today();
    $("formTitle").textContent="✍️ புதிய கணக்கு";
    $("saveBtn").textContent="Save Account";
    $("cancelEdit").hidden=true;
    renderAll();
    showPage("home");
    alert("கணக்கு சேமிக்கப்பட்டது!");
  }
});

$("historyList").addEventListener("click", e => {
  const editButton = e.target.closest("[data-edit]");
  const deleteButton = e.target.closest("[data-delete]");

  if(editButton){
    const a = accounts.find(x => x.id===editButton.dataset.edit);
    if(!a) return;

    $("editId").value=a.id;
    $("person").value=a.person || "";
    $("type").value=a.type;
    $("description").value=a.description;
    $("amount").value=a.amount;
    $("date").value=a.date;
    $("notes").value=a.notes || "";
    $("formTitle").textContent="✏️ கணக்கை மாற்று";
    $("saveBtn").textContent="Update Account";
    $("cancelEdit").hidden=false;
    showPage("add");
  }

  if(deleteButton){
    if(!confirm("இந்தக் கணக்கை நிரந்தரமாக நீக்க வேண்டுமா?")) return;
    const old = accounts;
    accounts=accounts.filter(a => a.id!==deleteButton.dataset.delete);
    if(!saveData()) accounts=old;
    renderAll();
  }
});

$("cancelEdit").addEventListener("click", () => {
  $("accountForm").reset();
  $("editId").value="";
  $("date").value=today();
  $("formTitle").textContent="✍️ புதிய கணக்கு";
  $("saveBtn").textContent="Save Account";
  $("cancelEdit").hidden=true;
});

$("search").addEventListener("input",renderHistory);
$("filterType").addEventListener("change",renderHistory);
$("filterMonth").addEventListener("change",renderHistory);

$("clearFilters").addEventListener("click",() => {
  $("search").value="";
  $("filterType").value="all";
  $("filterMonth").value="";
  renderHistory();
});

$("reportBtn").addEventListener("click",renderReport);
$("allReportBtn").addEventListener("click",() => {
  $("fromDate").value="";
  $("toDate").value="";
  renderReport();
});

$("backupBtn").addEventListener("click",() => {
  const blob = new Blob(
    [JSON.stringify({version:2,accounts},null,2)],
    {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="home-account-backup.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
});

$("restoreBtn").addEventListener("click",() => {
  const file=$("backupFile").files[0];
  if(!file){
    alert("முதலில் Backup கோப்பைத் தேர்ந்தெடுக்கவும்.");
    return;
  }

  if(!confirm("தற்போதைய கணக்குகளுக்குப் பதிலாக Backup கணக்குகள் சேர்க்கப்படும். தொடரவா?")) return;

  const reader=new FileReader();

  reader.onload=() => {
    try{
      const data=JSON.parse(reader.result);

      if(!data || !Array.isArray(data.accounts) ||
        !data.accounts.every(a =>
          a && typeof a.description==="string" &&
          typeof a.date==="string" &&
          (a.type==="income" || a.type==="expense") &&
          Number.isFinite(Number(a.amount)) &&
          Number(a.amount)>0
        )){
        throw new Error("Invalid backup");
      }

      const old=accounts;
      accounts=data.accounts.map(a => ({
        ...a,
        id:String(a.id || (Date.now()+Math.random())),
        person:String(a.person || ""),
        notes:String(a.notes || ""),
        createdAt:Number(a.createdAt || Date.now())
      }));

      if(!saveData()){
        accounts=old;
        return;
      }

      renderAll();
      alert("Backup வெற்றிகரமாக Restore செய்யப்பட்டது!");
    }catch(err){
      alert("Backup கோப்பு சரியான வடிவத்தில் இல்லை.");
    }
  };

  reader.readAsText(file);
});

$("date").value=today();
renderAll();
</script>

</body>
  </html>
